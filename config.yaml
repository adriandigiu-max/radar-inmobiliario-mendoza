# ==============================================================================
# CONFIGURACIÓN DEL BUSCADOR DE PROPIEDADES - MENDOZA
# ==============================================================================

search:
  # ----------------------------------------------------------------------------
  # CATEGORÍA A: CRITERIOS EXCLUYENTES (Filtro estricto)
  # Si no cumple con esto, se descarta automáticamente sin costo de IA.
  # ----------------------------------------------------------------------------
  locations:
    primary:
      - "Mendoza"       # Ciudad / Capital (Todas las secciones, Bombal, Quinta, etc.)
      - "Godoy Cruz"    # Godoy Cruz (Penaliza barrios fuera de Bombal)
    secondary_subzones:
      - zone: "Guaymallen"
        allowed_neighborhoods:
          - "dorrego"   # En Guaymallén ÚNICAMENTE barrio Dorrego

  property_types:
    - "departamento"
    - "casa"

  # Requisitos mínimos obligatorios (Excluyentes de Categoría A)
  min_bathrooms: 2  # Mínimo 2 baños completos
  min_bedrooms: 2   # Mínimo 2 habitaciones (dormitorios)
  min_rooms: 3      # Mínimo 3 ambientes

  budget:
    total_available_usd: 140000
    # Margen de contraoferta según mercado Mendoza (8.5% habitual para compras al contado):
    # Propiedades hasta $152.000 se evalúan para analizar si se pueden cerrar en $140.000
    negotiation_margin_pct: 8.5
    max_search_price_usd: 152000

  # ----------------------------------------------------------------------------
  # CATEGORÍA B: VALORES DESEADOS CON TOLERANCIA
  # No excluyen, pero otorgan mayor o menor puntaje base.
  # ----------------------------------------------------------------------------
  surface:
    target_m2: 80         # Target deseado: 80 m2 cubiertos
    min_m2_acceptable: 65 # Tolerancia mínima: por debajo de 65m2 penaliza fuertemente

  # ----------------------------------------------------------------------------
  # CATEGORÍA C: CARACTERÍSTICAS MUY DESEABLES (Puntos extra / Penalidades)
  # ----------------------------------------------------------------------------
  features:
    security_24hs:
      name: "Seguridad 24 hs / Barrio Privado"
      weight: 35
      penalty_if_missing: -25  # Alta penalidad por no tener seguridad 24hs
      description: "Seguridad 24 hs en edificio o barrio cerrado/privado en casas"
    gas_network:
      name: "Red de Gas Natural"
      weight: 20
      description: "Conexión a gas natural de red"
    parking:
      name: "Cochera"
      weight: 20
      description: "Cochera propia / garage cubierto"
    elevator:
      name: "Ascensor (en Deptos)"
      weight: 15
      description: "Edificio con ascensor (si es departamento en piso alto)"

